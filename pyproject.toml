[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpc-data-extraction"
version = "2.0.0"
description = "Minimal TGPC data extraction system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "tenacity>=8.2.3",
    "supabase>=2.28.0",
    "boto3>=1.28.0",
    "Pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pyzipper>=0.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "E501"]
"tgpc/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

# Coverage gate. `tgpc/` is the installed package; the one-shot helpers under
# `scripts/` are run by hand (VM, dashboard) and are reported separately, so
# holding them to the same bar would only encourage tests that exist to move
# a number.
[tool.coverage.run]
source = ["tgpc"]

[tool.coverage.report]
# CI passes --cov-fail-under, which is the one number that must not drift.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tgpc*"]
