[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgpc-data-extraction"
version = "2.0.0"
description = "Minimal TGPC data extraction system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "tenacity>=8.2.3",
    "supabase>=2.28.0",
    "boto3>=1.28.0",
    "Pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pyzipper>=0.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "E501"]
"tgpc/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

# Coverage gate. `tgpc/` is the installed package; the one-shot helpers under
# `scripts/` are run by hand (VM, dashboard) and are reported separately, so
# holding them to the same bar would only encourage tests that exist to move
# a number.
[tool.coverage.run]
source = ["tgpc"]

[tool.coverage.report]
# CI passes --cov-fail-under, which is the one number that must not drift.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# Type checking. `tgpc/` is the installed package, so it is what CI checks;
# `scripts/` stays out for the same reason it is out of coverage.
[tool.mypy]
python_version = "3.10"
files = ["tgpc"]
# Deliberately not --strict: this codebase is annotation-light, so the
# "missing annotation" family would report thousands of findings and bury the
# handful that describe a real mistake. These flags only fire on wrong code.
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# boto3/botocore ship no py.typed marker and pyzipper has no stubs at all.
# storage.py wraps both in a deliberately thin adapter, so the value of full
# stubs is low; the alternative (boto3-stubs) is a large dependency for CI.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "pyzipper", "pyzipper.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tgpc*"]
