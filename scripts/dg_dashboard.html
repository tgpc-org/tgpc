<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DG Fetch — Live</title>
<style>
  :root { color-scheme: light; }
  :root, [data-theme="light"] {
    --bg: #f9fafb; --card: #ffffff; --border: #e5e7eb;
    --ink: #111827; --ink-soft: #374151; --muted: #9ca3af; --log-border: #111827;
  }
  [data-theme="dark"] {
    --bg: #111827; --card: #374151; --border: #6b7280;
    --ink: #ffffff; --ink-soft: #e5e7eb; --muted: #9ca3af; --log-border: #6b7280;
  }
  html, body { height: 100vh; overflow: hidden; margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { flex-shrink: 0; background: #111827; color: #ffffff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header .spacer { flex: 1; }
  #theme-toggle { background: transparent; border: 1px solid #6b7280; color: #ffffff; border-radius: 6px;
                  padding: 4px 10px; font-size: 12px; cursor: pointer; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
  header .dot.running { background: #00cc66; }
  header .dot.stopped { background: #ef4444; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: #9ca3af; font-weight: 400; font-size: 13px; }
  main { flex: 1; min-height: 0; max-width: 960px; width: 100%; margin: 0 auto; padding: 10px 16px 8px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .card .value { font-size: 18px; font-weight: 700; margin-top: 1px; }
  .green { color: #00cc66; } .red { color: #ef4444; } .blue { color: #2563eb; } .muted { color: var(--muted); }
  .bar-wrap { background: #e5e7eb; border-radius: 4px; height: 8px; overflow: hidden; margin: 2px 0 8px; flex-shrink: 0; }
  .bar { background: #00cc66; height: 100%; width: 0%; transition: width 0.5s; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .current { font-size: 13px; }
  .current b { color: #2563eb; }
  button { background: #ef4444; color: #ffffff; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  pre { flex: 1; min-height: 80px; background: #111827; color: #e5e7eb; border: 1px solid var(--log-border); border-radius: 6px;
        padding: 8px 10px; font-size: 11px; line-height: 1.4;
        overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
  .reasons { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; flex-shrink: 0; }
  h3 { color: var(--ink); margin: 4px 0 4px; font-size: 13px; flex-shrink: 0; }
  footer { font-size: 11px; color: var(--muted); margin-top: 4px; flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>DG Fetch <span>— live extraction monitor</span></h1>
  <div class="spacer"></div>
  <button id="theme-toggle" onclick="toggleTheme()">Dark</button>
</header>
<main>
  <div class="row">
    <div class="current">Current: <b id="current">—</b> <span class="muted" id="event"></span></div>
  </div>
  <div class="row">
    <div class="current">Next: <b id="next">—</b> <span class="muted" id="remaining"></span></div>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="row"><span class="muted" id="alltime"></span></div>
  <div class="cards">
    <div class="card"><div class="label">Saved</div><div class="value green" id="done">0</div></div>
    <div class="card"><div class="label">Couldn't fetch</div><div class="value red" id="failed">0</div></div>
    <div class="card"><div class="label">In cloud database</div><div class="value blue" id="sb">0</div></div>
    <div class="card"><div class="label">Speed / min</div><div class="value" id="rate">—</div></div>
    <div class="card"><div class="label">Time left (min)</div><div class="value" id="eta">—</div></div>
  </div>
  <div class="row">
    <button id="stop" onclick="stopRun()">STOP after current record</button>
    <span class="muted" id="stopmsg"></span>
  </div>
<div class="row">
    <button id="start" onclick="startRun()" style="background:#00cc66">START next</button>
    <input id="count" type="number" value="500" min="1" max="2000"
           style="width:80px;padding:7px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--ink)">
    <span class="muted">records</span>
    <span class="muted" id="startmsg"></span>
</div>
  <div class="reasons" id="reasons"></div>
  <h3>Live log</h3>
  <pre id="log">waiting for run…</pre>
  <footer id="updated"></footer>
</main>
<script>
function plainReason(key) {
  if (key.includes('Not authorized')) return 'site does not share these records';
  if (key.includes('Not-found') || key.includes('not be found')) return 'no such record on the site';
  if (key.includes('Captcha-fail')) return 'picture-code was misread, retried';
  if (key.includes('captcha_solver_missing')) return 'captcha reader not installed';
  if (key.includes('bad_mobile')) return 'mobile number wrong at source';
  if (key.includes('bad_email')) return 'email wrong at source';
  if (key.includes('bad_dob') || key.includes('bad_dor') || key.includes('bad_validity')) return 'date wrong at source';
  if (key.includes('unknown_reg')) return 'ID not in our master list';
  if (key.includes('identity_mismatch') || key.includes('guard:')) return 'details differ from our list';
  if (key.includes('Blocked')) return 'site temporarily blocked us';
  if (key.includes('unexpected')) return 'unexpected error';
  return key;
}
function applyTheme(name) {
  document.documentElement.setAttribute('data-theme', name);
  try { localStorage.setItem('dg-theme', name); } catch (e) {}
  document.getElementById('theme-toggle').textContent = name === 'dark' ? 'Light' : 'Dark';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('dg-theme'); } catch (e) {}
  if (saved !== 'dark' && saved !== 'light') {
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(saved);
})();
async function refresh() {
  try {
    const s = await (await fetch('/api/status')).json();
    const dot = document.getElementById('dot');
    dot.className = 'dot ' + (s.status === 'running' ? 'running' : s.status === 'stopped' ? 'stopped' : '');
    document.getElementById('current').textContent =
      s.current_reg ? s.current_reg + (s.serial_number != null ? ' (#' + s.serial_number + ')' : '') : '—';
    document.getElementById('next').textContent =
      s.next_reg ? s.next_reg + (s.next_serial != null ? ' (#' + s.next_serial + ')' : '') : '—';
    document.getElementById('remaining').textContent =
      (s.remaining_in_batch != null && s.status === 'running') ? s.remaining_in_batch + ' left in batch' : '';
    document.getElementById('event').textContent = s.event || '';
    document.getElementById('done').textContent = s.done;
    document.getElementById('failed').textContent = s.failed;
    document.getElementById('sb').textContent = s.sb_upserted;
    document.getElementById('rate').textContent = s.records_per_min ?? '—';
    document.getElementById('eta').textContent = s.eta_mins ?? '—';
    const pct = s.total ? Math.round(100 * s.processed / s.total) : 0;
    document.getElementById('bar').style.width = pct + '%';
    const at = s.all_time || {};
    document.getElementById('alltime').textContent =
      'All time: ' + (at.completed || 0) + ' completed · ' + (at.refused || 0) + ' refused at source (' +
      (s.resolved || 0) + ' resolved)';
    const reasons = Object.entries(s.fail_by_reason || {}).map(([k, v]) => plainReason(k) + ': ' + v).join(' · ');
    document.getElementById('reasons').textContent = reasons ? 'Why some are missing — ' + reasons : '';
    document.getElementById('updated').textContent = 'Updated: ' + (s.updated_ist || s.updated_at || '—') +
      ' · Finished: ' + s.completed;
    const stopBtn = document.getElementById('stop');
    if (s.stop_armed) { stopBtn.disabled = true; document.getElementById('stopmsg').textContent = 'stop armed…'; }
    else { stopBtn.disabled = s.status !== 'running'; document.getElementById('stopmsg').textContent = ''; }
    const startBtn = document.getElementById('start');
    startBtn.disabled = !!s.run_active;
    const lines = await (await fetch('/api/log')).json();
    const pre = document.getElementById('log');
    pre.textContent = lines.join('\n') || 'waiting for run…';
    pre.scrollTop = pre.scrollHeight;
  } catch (e) { /* server restarting? retry next tick */ }
}
async function stopRun() {
  if (!confirm('Stop after the current record? Checkpoint stays safe.')) return;
  await fetch('/api/stop', {method: 'POST'});
  refresh();
}
async function startRun() {
  const count = parseInt(document.getElementById('count').value, 10) || 500;
  const msg = document.getElementById('startmsg');
  msg.textContent = 'starting…';
  try {
    const r = await (await fetch('/api/start', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({count})})).json();
    msg.textContent = r.ok ? ('running ' + r.count + ' records from ' + r.first) : ('not started: ' + r.error);
  } catch (e) { msg.textContent = 'start failed'; }
  refresh();
}
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
