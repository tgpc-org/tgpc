name: Load Test

# Weekly k6 proof against the live site (manual runs choose the profile).
# Smoke is CI-quick; load ramps to 28 VUs. Thresholds (p95 < 3s, errors < 1%)
# fail the run. Polite by design — see ui/load/prod.js header.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: 'k6 profile'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, load]

jobs:
  k6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: Install k6
        run: |
          curl -fsSL -o /tmp/k6.tgz 'https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz'
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo mv /tmp/k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Run k6 (smoke)
        if: github.event.inputs.profile == '' || github.event.inputs.profile == 'smoke'
        run: k6 run load/prod.js
      - name: Run k6 (load)
        if: github.event.inputs.profile == 'load' || github.event_name == 'schedule'
        run: k6 run load/prod.js -e PROFILE=load
