name: UI Checks

on:
  push:
    branches: [main, dev]
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    # Placeholder PUBLIC vars: real values are configured in the Cloudflare
    # Pages dashboard / local .env. They must be present at job level because
    # `svelte-kit sync` bakes them into the $env/static/public typings that
    # svelte-check validates against.
    env:
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key
      PUBLIC_R2_PHOTO_BASE: https://placeholder.r2.dev/photos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:colors
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

      # Dependency vulnerability scan. `--audit-level=high` fails the build on
      # high/critical advisories without blocking on low/moderate noise.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
