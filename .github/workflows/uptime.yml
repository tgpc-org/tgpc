name: Uptime

# Availability alarm for the public portal.
#
# Every 30 minutes (and on demand) a runner probes /api/health, which covers
# both halves of "is the portal working": Supabase reachability and whether the
# registry sync is still fresh (`last_sync` older than 48h reports `degraded`).
#
# Only `down` fails the run and opens an issue. That is the signal nobody else
# is watching. `degraded` is a workflow warning instead: the registry is
# refreshed by a manual pipeline run, so a stale window between runs is
# expected, and a 30-minute alarm on it is exactly the noise that got the
# 2026-10 freshness poll removed. The script decides (`Verdict.alarming`);
# this file only routes the verdict.
#
# Alerting is a single issue labelled `uptime`: the first failure opens it,
# later failures comment on it, and the next passing run closes it. That keeps
# 48 runs a day from becoming 48 notifications while still failing the workflow,
# which is what GitHub actually notifies on.
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity; any push re-enables them.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # Verify the monitor whenever the monitor itself changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/uptime.yml'
      - 'scripts/uptime_check.py'
      - 'tests/test_uptime_check.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Ensure the uptime label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create uptime --description "Automated availability alarm" --color ef4444 --force

      - name: Probe /api/health
        id: health
        continue-on-error: true
        run: python3 scripts/uptime_check.py --url https://tgpc.pages.dev/api/health --timeout 20

      - name: Warn when the registry data is stale
        if: steps.health.outputs.state == 'degraded'
        env:
          REASON: ${{ steps.health.outputs.reason }}
        run: echo "::warning::Registry data is stale - $REASON"

      - name: Open or update the uptime issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.health.outputs.title }}
          BODY: ${{ steps.health.outputs.body }}
        run: |
          title="${TITLE:-Uptime: portal health check failed}"
          body="${BODY:-The scheduled uptime check failed. See this workflow run for details.}"
          number=$(gh issue list --label uptime --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label uptime
          fi

      - name: Close the uptime issue on recovery
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.health.outputs.recovery_body }}
        run: |
          number=$(gh issue list --label uptime --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open uptime issue; nothing to close"
            exit 0
          fi
          gh issue comment "$number" --body "${BODY:-Recovered: the health check passes again.}"
          gh issue close "$number" --reason completed

      - name: Fail while the portal is down
        if: steps.health.outcome == 'failure'
        run: exit 1
