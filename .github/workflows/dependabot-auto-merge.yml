name: Dependabot auto-merge

# Lands Dependabot PRs automatically once CI is green. All updates — major,
# minor and patch — merge themselves; the `gate` check is the only safety net,
# so a breaking major bump that fails CI simply stays open as a PR.
#
# Works together with branch protection on `main`, which requires the `gate`
# check: `--auto` queues the merge and GitHub executes it only when every
# required check has passed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge all Dependabot updates
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}