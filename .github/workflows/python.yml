name: Python Checks

on:
  push:
    branches: [main, dev]
    paths: ['tgpc/**', 'tests/**', 'pyproject.toml', '.github/workflows/python.yml']
  pull_request:
    paths: ['tgpc/**', 'tests/**', 'pyproject.toml', '.github/workflows/python.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pinned to match .pre-commit-config.yaml (astral-sh/ruff-pre-commit v0.16.6)
      - run: pip install -e . pytest ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
      - run: python3 -m pytest tests/ -q

      # Dependency vulnerability scan (PyPA pip-audit). Fails on any known
      # vulnerable package in the installed environment.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) --progress-spinner off
