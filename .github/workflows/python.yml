name: Python Checks

on:
  push:
    branches: [main, dev]
    # scripts/** is included because tests/ covers it (test_dg_dashboard.py);
    # without it a scripts-only change would skip the pytest run that guards it.
    paths: ['tgpc/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/python.yml']
  pull_request:
    paths: ['tgpc/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/python.yml']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pinned to match .pre-commit-config.yaml (astral-sh/ruff-pre-commit v0.16.6)
      - run: pip install -e . pytest pytest-cov==7.1.0 ruff==0.16.6 mypy==2.4.0
      # CI installs from the floors in pyproject.toml (above) so the declared
      # minimum versions are what gets tested; the lock is for reproducible
      # local installs. This only stops it drifting silently out of sync.
      # uv lives in its own venv: installing it into the project env would put
      # it in `pip freeze`, and the audit below would then scan a tool we never
      # ship (it did, and failed the run on a uv advisory).
      - name: Verify uv.lock is in sync with pyproject.toml
        run: |
          python -m venv /tmp/uv-venv
          /tmp/uv-venv/bin/pip install --quiet uv==0.13.4
          /tmp/uv-venv/bin/uv lock --check
      - run: ruff check .
      - run: ruff format --check .
      # Type check the installed package. Config (and the boto3/pyzipper
      # stub exemptions) lives in pyproject.toml; this is not --strict, so it
      # only fails on genuinely wrong code. Deliberately not a pre-commit hook:
      # mypy needs the project's own venv to resolve third-party imports, and
      # a self-contained hook env would only report hundreds of missing stubs.
      - run: mypy
      # Coverage gate: the suite sits at 67% of tgpc/ today, so 65 is the
      # floor — low enough that ordinary refactors don't trip it, high enough
      # that a new untested module (the size of one of the smaller ones) does.
      # Raise this number when the suite genuinely improves, never lower it.
      - run: python3 -m pytest tests/ -q --cov --cov-fail-under=65

      # Dependency vulnerability scan (PyPA pip-audit). Fails on any known
      # vulnerable package in the installed environment. Editable installs
      # (this repo itself) are excluded: the package isn't on PyPI, so the
      # lookup either warns or hard-fails on transient PyPI errors.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip freeze | grep -v "^-e " > /tmp/requirements-audit.txt
          pip-audit -r /tmp/requirements-audit.txt --progress-spinner off
