name: ♻️ RPh Sync

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Skip scrape, just re-sync existing data'
        required: false
        type: boolean
        default: false

jobs:
  rphsync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -e .
        python3 -m pip install supabase
        python3 -m pip install awscli --break-system-packages --quiet 2>&1 | tail -1

    - name: Setup Cloudflare WARP
      run: |
        echo "Installing Cloudflare WARP..."
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg 2>/dev/null
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
        sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
        sudo systemctl start warp-svc
        echo "Waiting for WARP service..."
        sleep 5
        warp-cli register 2>/dev/null || echo "Already registered"
        warp-cli connect
        sleep 3
        echo "WARP connected"

    - name: Create data directory
      run: mkdir -p data/backups

    - name: Restore data from artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ ! -f data/rph.json ]; then
          echo "No local data found. Trying artifact restore..."
          if gh run download --repo "${GITHUB_REPOSITORY}" -n rph-data --dir data/ 2>/dev/null && [ -f data/rph.json ]; then
            echo "Restored rph.json from artifact ($(wc -c < data/rph.json) bytes)"
          else
            echo "No artifact found — will do full scrape"
          fi
        else
          echo "Local rph.json found ($(wc -c < data/rph.json) bytes)"
        fi

    - name: Run tgpc update
      id: update
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        RCLONE_GDRIVE_CONFIG: ${{ secrets.RCLONE_GDRIVE_CONFIG }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ "${{ github.event.inputs.force_sync }}" == "true" && -f data/rph.json ]]; then
          echo "FORCE SYNC MODE — re-syncing existing data"
          python3 -m tgpc sync
        else
          echo "Starting TGPC data update..."
          python3 -m tgpc update
        fi

    - name: Upload data to artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rph-data
        path: |
          data/rph.json
          data/update_details.json
        retention-days: 90

    - name: Notify on failure
      if: failure()
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        GH_REPO: ${{ github.repository }}
        GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -n "$RESEND_API_KEY" ] && [ -n "$NOTIFICATION_EMAIL" ]; then
          SUBJECT="🚨 TGPC RPh Sync Failed"
          BODY=$(cat <<'EOF'
          <html>
            <body style="font-family: system-ui, sans-serif; line-height: 1.6; color: #111;">
              <h2 style="color: #ef4444;">TGPC RPh Sync Failed</h2>
              <p>The scheduled/manual sync workflow failed.</p>
              <p><strong>Repository:</strong> {{GH_REPO}}</p>
              <p><strong>Run:</strong> <a href="{{GH_RUN_URL}}">View logs</a></p>
              <hr style="border-color: #e5e7eb;">
              <p style="color: #6b7280; font-size: 0.875rem;">This is an automated notification from GitHub Actions.</p>
            </body>
          </html>
          EOF
          )
          BODY="${BODY//\{\{GH_REPO\}\}/$GH_REPO}"
          BODY="${BODY//\{\{GH_RUN_URL\}\}/$GH_RUN_URL}"

          curl -s -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"TGPC Sync <onboarding@resend.dev>\",
              \"to\": [\"$NOTIFICATION_EMAIL\"],
              \"subject\": \"$SUBJECT\",
              \"html\": \"$BODY\"
            }" || echo "Failed to send notification email"
        else
          echo "Notification not configured — skipping email"
        fi
