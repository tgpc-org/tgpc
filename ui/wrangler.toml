name = "tgpc"
compatibility_date = "2026-06-05"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".svelte-kit/cloudflare"

[[r2_buckets]]
binding = "DISPATCH"
bucket_name = "tgpc"
# Read through src/env.ts ($app/env/private) + dispatchBucket() in
# src/lib/server/appEnv.ts, NOT event.platform: adapter-cloudflare v8 does not
# pass `platform` to server.respond, so `event.platform` is undefined in
# production (audit F13). Declaring the binding here is still required - it is
# what populates the worker env that $app/env reads.
